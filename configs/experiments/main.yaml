# Main reproducible experiment: `make reproduce-main-results`
name: main
seed: 2024
data_config: configs/data/default.yaml
events_config: configs/events/taxonomy.yaml

splits:
  temporal:
    train: ["1991-01-01", "2010-12-31"]
    val:   ["2011-01-01", "2016-12-31"]
    test:  ["2017-01-01", "2024-12-31"]
    gap_days: 60                    # embargo between periods (window length) to prevent leakage
  spatial:
    strategy: basin                 # basin | longitude_block | random_station (grouped)
    test_groups: [Koshi, Mahakali]  # held-out basins never seen in training
    val_fraction_of_train_stations: 0.2
  # spatiotemporal = unseen stations AND future period (hardest, most realistic)
  modes: [temporal, spatial, spatiotemporal]

window_days: 60
feature_lags: [1, 3, 7, 15, 30]
rolling_windows: [3, 7, 15, 30]
max_train_samples: 40000           # uniform random subsample of training windows (keeps base rate; CPU budget)
max_eval_samples: 40000

baselines: [climatology, persistence, logistic, random_forest, hist_gbm, xgboost, lightgbm]
deep_models: [lstm, gru, tcn, transformer]

deep:
  epochs: 6
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  hidden: 64
  dropout: 0.2
  patience: 2
  device: auto

pretrain:
  epochs: 5
  batch_size: 256
  lr: 1.0e-3
  mask_ratio: 0.3
  mean_span: 5
  d_model: 64
  n_layers: 3
  n_heads: 4
  contrastive_weight: 0.1
  multiscale_weight: 0.2
  max_samples: 60000

ablation:                           # Section 13 of the specification
  A_met_only:          { dynamic: met,          static: [],            ssl: false }
  B_met_temporal:      { dynamic: met_temporal, static: [],            ssl: false }
  C_met_gis:           { dynamic: met_temporal, static: [gis],         ssl: false }
  D_met_gis_rs:        { dynamic: met_temporal, static: [gis, rs],     ssl: false }
  E_ssl_representation: { dynamic: met_temporal, static: [],            ssl: true }
  F_full_multimodal:   { dynamic: met_temporal, static: [gis, rs, meta], ssl: true }

uncertainty:
  ensemble_members: 3
  mc_dropout_samples: 10
  conformal_alpha: 0.1

robustness:
  missing_rates: [0.0, 0.1, 0.3, 0.5]

bootstrap:
  n: 200
  block: station

label_fractions: [0.05, 0.2, 1.0]   # H2: SSL vs scratch under label scarcity (temporal split)
